<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word &lt;-&gt; PDF Converter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
    }

    h1 {
      font-size: 1.6rem;
      color: #1a202c;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: #718096;
      font-size: 0.9rem;
      margin-bottom: 1.8rem;
    }

    .drop-zone {
      border: 2px dashed #cbd5e0;
      border-radius: 8px;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: #4299e1;
      background: #ebf8ff;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

    .drop-label {
      color: #4a5568;
      font-size: 0.95rem;
    }

    .drop-label span {
      color: #4299e1;
      font-weight: 600;
    }

    .file-types {
      color: #a0aec0;
      font-size: 0.8rem;
      margin-top: 0.3rem;
    }

    #file-name {
      margin-top: 0.8rem;
      font-size: 0.9rem;
      color: #2d3748;
      font-weight: 500;
      min-height: 1.2em;
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 1.2rem;
      padding: 0.75rem;
      background: #4299e1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover:not(:disabled) { background: #3182ce; }
    .btn:disabled { background: #a0aec0; cursor: not-allowed; }

    #status {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    #status.error { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
    #status.success { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
    #status.loading { background: #ebf8ff; color: #2b6cb0; border: 1px solid #90cdf4; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Word &lt;-&gt; PDF Converter</h1>
    <p class="subtitle">Upload a Word file to get a PDF, or a PDF to get a Word file</p>

    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept=".docx,.doc,.pdf" />
      <div class="drop-icon">📄</div>
      <div class="drop-label"><span>Click to upload</span> or drag &amp; drop</div>
      <div class="file-types">Supported: .docx, .doc, .pdf &mdash; Max 50 MB</div>
    </div>

    <div id="file-name"></div>

    <button class="btn" id="convert-btn" disabled>Convert</button>

    <div id="status"></div>
  </div>

  <script>
    const dropZone = document.getElementById("drop-zone");
    const fileInput = document.getElementById("file-input");
    const fileNameEl = document.getElementById("file-name");
    const convertBtn = document.getElementById("convert-btn");
    const statusEl = document.getElementById("status");

    let selectedFile = null;

    function setFile(file) {
      if (!file) return;
      const ext = file.name.split(".").pop().toLowerCase();
      if (!["docx", "doc", "pdf"].includes(ext)) {
        showStatus("error", "Only .docx, .doc, and .pdf files are supported.");
        return;
      }
      selectedFile = file;
      const outputExt = ext === "pdf" ? ".docx" : ".pdf";
      fileNameEl.textContent = `Selected: ${file.name}  →  will produce ${file.name.replace(/\.[^.]+$/, outputExt)}`;
      convertBtn.textContent = ext === "pdf" ? "Convert to Word" : "Convert to PDF";
      convertBtn.disabled = false;
      statusEl.style.display = "none";
    }

    fileInput.addEventListener("change", () => setFile(fileInput.files[0]));

    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      setFile(e.dataTransfer.files[0]);
    });

    function showStatus(type, message) {
      statusEl.className = type;
      statusEl.innerHTML = type === "loading"
        ? `<span class="spinner"></span>${message}`
        : message;
      statusEl.style.display = "block";
    }

    convertBtn.addEventListener("click", async () => {
      if (!selectedFile) return;

      convertBtn.disabled = true;
      showStatus("loading", "Converting, please wait...");

      const formData = new FormData();
      formData.append("file", selectedFile);

      try {
        const response = await fetch("/convert", { method: "POST", body: formData });

        if (!response.ok) {
          const data = await response.json().catch(() => ({ error: "Conversion failed." }));
          showStatus("error", data.error || "Conversion failed.");
          convertBtn.disabled = false;
          return;
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const stem = selectedFile.name.replace(/\.[^.]+$/, "");
        const ext = selectedFile.name.split(".").pop().toLowerCase();
        a.href = url;
        a.download = stem + (ext === "pdf" ? ".docx" : ".pdf");
        a.click();
        URL.revokeObjectURL(url);

        showStatus("success", "Conversion successful! Your file has been downloaded.");
      } catch (err) {
        showStatus("error", "Network error. Please try again.");
      } finally {
        convertBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
